name: Extension release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish extension ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      WXT_EXTENSION_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check shared and extension types
        run: npm run typecheck --workspace=@reporty/shared --workspace=@reporty/extension

      - name: Test shared package
        run: npm run test --workspace=@reporty/shared

      - name: Build production ZIP
        run: npm run zip:extension:production

      - name: Verify ZIP and production backend
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile

          api = "https://reporty-extension.vercel.app"
          with zipfile.ZipFile("downloads/reporty-chrome.zip") as archive:
              assert archive.testzip() is None, "Archivio ZIP danneggiato"
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest.get("version") == os.environ["WXT_EXTENSION_VERSION"], "Versione del manifest diversa dalla release"
              assert manifest.get("manifest_version") == 3, "Manifest V3 richiesto"
              assert manifest.get("name") == "Reporty", "Nome estensione inatteso"
              assert manifest.get("host_permissions") == [api + "/*"], "Permessi backend non di produzione"
              assert manifest.get("externally_connectable", {}).get("matches") == [api + "/*"], "Collegamento dashboard non di produzione"
              assert any(api + "/guest/*" in script.get("matches", []) for script in manifest.get("content_scripts", [])), "Bridge ospiti non di produzione"
              assert api.encode() in archive.read(manifest["background"]["service_worker"]), "Backend di produzione assente dal bundle"
          print("ZIP verificato: Manifest V3 e backend di produzione")
          PY

      - name: Publish extension release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="extension-v${WXT_EXTENSION_VERSION}"
          asset="$RUNNER_TEMP/${tag}.zip"
          cp downloads/reporty-chrome.zip "$asset"

          # Un nuovo tentativo riprende una bozza o conserva la release già pubblicata.
          if draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"; then
            if [ "$draft" = "false" ]; then
              echo "Release already published: $tag"
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/extension-release-notes.md" <<EOF
          Reporty extension v${WXT_EXTENSION_VERSION} for Chrome and Edge, built for https://reporty-extension.vercel.app.

          Commit: $GITHUB_SHA

          Download ${tag}.zip, extract it to a permanent folder, then open chrome://extensions or edge://extensions, enable Developer mode and choose Load unpacked.

          To update, extract the new ZIP into the same folder and click Reload on the extensions page.
          EOF
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/extension-release-notes.md" \
              --draft
          fi

          gh release upload "$tag" "$asset" --clobber

          # Una build precedente può terminare dopo quella di un push più recente.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          latest=false
          if [ "$GITHUB_SHA" = "$main_sha" ]; then
            latest=true
          fi
          gh release edit "$tag" --draft=false --latest="$latest"
